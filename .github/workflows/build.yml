name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
      - run: flutter create --platforms=android .
      - run: |
          python3 -c "
          import re, os
          new_ver = '2.1.0'
          for f in ['android/settings.gradle','android/settings.gradle.kts','android/build.gradle','android/build.gradle.kts']:
              if not os.path.exists(f): continue
              c = open(f).read()
              c2 = re.sub(r'id\s*[\(]?\s*\"org\.jetbrains\.kotlin\.android\"\s*[\)]?\s+version\s+\"[^\"]*\"', f'id \"org.jetbrains.kotlin.android\" version \"{new_ver}\"', c)
              if c2 != c: open(f,'w').write(c2); print(f'Fixed: {f}')
          ab = 'android/app/build.gradle'
          if os.path.exists(ab):
              c = open(ab).read()
              c2 = re.sub(r'ext\.kotlin_version\s*=\s*\"[^\"]*\"', f'ext.kotlin_version = \"{new_ver}\"', c)
              if c2 != c: open(ab,'w').write(c2); print('Fixed: ext.kotlin_version')
          "
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
