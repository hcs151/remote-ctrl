name: Build APKon:  push:    branches: [main, master]  workflow_dispatch:jobs:  build:    runs-on: ubuntu-latest    steps:      - uses: actions/checkout@v4      - uses: subosito/flutter-action@v2        with:          flutter-version: '3.29.3'      - run: flutter create --platforms=android .
      - run: |
          echo 'android { ndkVersion = "27.0.12077973" }' >> android/app/build.gradle.kts      - run: flutter pub get      - run: flutter build apk --release      - uses: actions/upload-artifact@v4        with:          name: app-release          path: build/app/outputs/flutter-apk/app-release.apk
